name: SOC Lab Configuration Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-lab-assets:
    name: Validate lab assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate XML, SVG, Wazuh rule IDs, and Shuffle branches
        run: python scripts/validate_lab_assets.py

      - name: Run validator tests
        run: python -m unittest discover -s tests -v
